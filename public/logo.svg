<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <clipPath id="vant-triangle-clip">
      <polygon points="36,36 476,36 256,476" />
    </clipPath>

    <!-- SVG 1.1 standard drop shadow compatible with Inkscape, Illustrator, and all browsers -->
    <filter id="vant-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.22" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="vant-purple-left" x1="256" y1="296" x2="340" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E043B" />
      <stop offset="32%" stop-color="#3B0F96" />
      <stop offset="56%" stop-color="#9A5CFF" />
      <stop offset="82%" stop-color="#5B21B6" />
      <stop offset="100%" stop-color="#43188E" />
    </linearGradient>

    <linearGradient id="vant-purple-right" x1="476" y1="36" x2="310" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09022E" />
      <stop offset="38%" stop-color="#4C1D95" />
      <stop offset="72%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#3B0F8C" />
    </linearGradient>

    <linearGradient id="vant-grey-bevel" x1="124" y1="36" x2="256" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E4E8" />
      <stop offset="100%" stop-color="#D4D7DD" />
    </linearGradient>

    <linearGradient id="vant-tip-shade" x1="256" y1="296" x2="308" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6E8EC" />
      <stop offset="100%" stop-color="#F4F5F7" />
    </linearGradient>
  </defs>

  <g filter="url(#vant-shadow)">
    <g clip-path="url(#vant-triangle-clip)">
      <!-- Base bright white triangle surface -->
      <polygon points="36,36 476,36 256,476" fill="#FFFFFF" />

      <!-- Top-left inner bevel behind ghost -->
      <polygon points="124,36 256,36 256,280 182,138" fill="url(#vant-grey-bevel)" />

      <!-- Right purple folded wing (left facet + right facet) -->
      <polygon points="256,296 330,144 330,360 308,372" fill="url(#vant-purple-left)" />
      <polygon points="330,144 476,36 308,372 330,360" fill="url(#vant-purple-right)" />

      <!-- Subtle dark ridge where right white wing meets purple -->
      <line x1="330" y1="144" x2="476" y2="36" stroke="#14064A" stroke-width="1.5" opacity="0.65" />

      <!-- Ghost silhouette -->
      <path
        d="M 182,110
           A 74,74 0 0,1 330,110
           L 330,164
           L 256,292
           L 182,152
           Z"
        fill="#050507"
      />

      <!-- Left & right arched ghost eyes -->
      <path d="M 216,124 A 15,18 0 0,1 246,124 Z" fill="#E6E8EC" />
      <path d="M 266,124 A 15,18 0 0,1 296,124 Z" fill="#E6E8EC" />

      <!-- Left white ribbon & bottom folded tip -->
      <polygon points="36,36 124,36 308,372 256,476" fill="#FFFFFF" />
      <!-- Subtle right-half fold shading on bottom tip -->
      <polygon points="256,274 308,372 256,476" fill="url(#vant-tip-shade)" />
      <line x1="256" y1="274" x2="256" y2="476" stroke="#D1D5DB" stroke-width="1" opacity="0.7" />
    </g>

    <!-- Crisp outer hairline -->
    <polygon points="36,36 476,36 256,476" stroke="#CBD5E1" stroke-width="1" stroke-linejoin="round" />
  </g>
</svg>